[tool.poetry]
name = "healthlake"
version = "0.1.0"
description = "Hospital readmission prediction pipeline"
package-mode = false
authors = ["MuriloGomesMadrona <murilogomesmadrona01@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.13"
pyspark = ">=4.1.2,<5.0.0"
mlflow = ">=3.12.0,<4.0.0"
xgboost = ">=3.2.0,<4.0.0"
scikit-learn = ">=1.8.0,<2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0.0"
ruff = ">=0.15.15,<0.16.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]